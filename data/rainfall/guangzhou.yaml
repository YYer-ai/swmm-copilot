# 广州市暴雨强度公式库（数据来源：官方公开文件，仅供工程设计参考）
# 来源：广州市水务局《广州市暴雨强度公式编制与设计暴雨雨型研究技术报告（简本）》
# 下载：http://swj.gz.gov.cn/attachment/7/7870/7870863/8835843.pdf
# 编制依据：GB 50014-2021《室外排水设计标准》，皮尔逊-Ⅲ型曲线，年最大值法，近 40 年资料（1981-2020）
# 公式单位：q [L/(s·公顷)]，t [min]，P [年]
#
# 两种公式形式（本库统一）：
#   general  总公式：  q = A·(1 + C·lgP) / (t + b)^n          A 已含 167 换算系数
#   interval 区间公式：q = 167·A(P) / (t + b(P))^n(P)
#             其中 A/b/n = p1 + p2·ln(P - p3)  （A 单位 mm，为雨力参数）
#   single   单一重现期公式：q = A / (t + b)^n   （仅用于校验）
# 适用范围：t = 1~180 分钟（短历时），P = 1~100 年

