# 深圳市分流域暴雨强度公式库（数据来源：官方公开文件，仅供工程设计参考）
# 来源：深圳市气象局、市规划和自然资源局、市水务局《深圳市分流域暴雨强度公式及查算图表》（2024版）
# 下载：https://weather.sz.gov.cn/attachment/1/1547/1547780/11971465.pdf
# 说明：深圳 2015 版公式自 2024-12-23 起废止；本文件为 2024 版分流域公式。
# 公式形式：q [L/(s·公顷)]，t [min]，P [年]，t 适用 5~180 分钟（查算表 1~180）
#   interval 区间公式：q = 167·A(P) / (t + b(P))^n(P)，A/b/n = p1 + p2·ln(P - p3)，A 单位 mm
#   single   单一重现期：q = A / (t + b)^n
#   validation 官方雨量表抽样点（mm），用于程序自检

city: 深圳市
version: "2024版分流域"
source: 深圳市气象局等三部门《深圳市分流域暴雨强度公式及查算图表》
source_url: https://weather.sz.gov.cn/attachment/1/1547/1547780/11971465.pdf

