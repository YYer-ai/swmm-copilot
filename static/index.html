<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swmm-copilot 内涝快评</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M16 5c4.5 5.4 8 9.6 8 13.5A8 8 0 1 1 8 18.5C8 14.6 11.5 10.4 16 5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --blue:#2563eb; --blue-d:#1d4ed8; --green:#16a34a; --red:#dc2626; --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --text:#1f2937; --muted:#6b7280;
          --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06); }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:linear-gradient(180deg,#e5eefc 0%,var(--bg) 300px); color:var(--text); }
  .wrap { max-width:980px; margin:0 auto; padding:22px 16px 60px; }
  header { display:flex; align-items:center; gap:11px; margin:4px 0 20px; }
  header .logo { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#60a5fa,#1d4ed8); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); flex:none; }
  header .logo svg { width:20px; height:20px; }
  header .tt h1 { font-size:19px; letter-spacing:.3px; }
  header .tt .sub { color:var(--muted); font-size:12px; margin-top:1px; }
  header .ver { margin-left:auto; font-size:11px; color:#94a3b8; align-self:flex-start; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow); }
  .card h2 { font-size:14px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .card h2::before { content:""; width:3.5px; height:14px; border-radius:2px; background:var(--blue); }
  .card.attention { border-color:#f59e0b; animation:pulse 2.2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.30)} 55%{box-shadow:0 0 0 7px rgba(245,158,11,0)} }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:720px){ .grid{grid-template-columns:1fr;} }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:9px; font-size:14px; transition:border-color .15s, box-shadow .15s; background:#fff; }
  input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px #dbeafe; }
  .btn { padding:8px 18px; border:none; border-radius:9px; font-size:14px; cursor:pointer; background:linear-gradient(180deg,#3b82f6,var(--blue-d)); color:#fff; transition:filter .15s, transform .05s; }
  .btn:hover { filter:brightness(1.08); }
  .btn:active { transform:translateY(1px); }
  .btn:disabled { background:#93c5fd; cursor:not-allowed; filter:none; }
  .btn.ghost { background:#fff; color:var(--blue-d); border:1px solid #bfdbfe; }
  .btn.ghost:hover { background:#eff6ff; }
  .row { display:flex; gap:10px; margin-top:14px; align-items:center; flex-wrap:wrap; }
  .status { font-size:13px; padding:7px 12px; border-radius:9px; display:none; margin-top:12px; white-space:pre-wrap; }
  .status.ok { display:block; background:#f0fdf4; color:var(--green); border:1px solid #bbf7d0; }
  .status.err { display:block; background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { font-size:12.5px; padding:5px 13px; border-radius:999px; background:#eff6ff; color:var(--blue-d); cursor:pointer; border:1px solid #c7d2fe; transition:all .15s; }
  .chip:hover { background:var(--blue); color:#fff; border-color:var(--blue); }
  #msgs { display:flex; flex-direction:column; gap:12px; padding:4px 2px; }
  .msg { max-width:86%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.65; overflow-x:auto; }
  .msg.user { align-self:flex-end; background:linear-gradient(180deg,#3b82f6,var(--blue-d)); color:#fff; white-space:pre-wrap; }
  .msg.bot { align-self:flex-start; background:#f8fafc; border:1px solid var(--line); }
  .msg.bot table { border-collapse:collapse; margin:8px 0; font-size:13px; }
  .msg.bot th,.msg.bot td { border:1px solid var(--line); padding:4px 10px; }
  .msg.bot th { background:#f1f5f9; }
  .msg.bot code { background:#eff6ff; padding:1px 5px; border-radius:4px; font-size:13px; word-break:break-all; }
  .msg.bot h3 { font-size:14px; margin:10px 0 4px; }
  .msg.bot ul,.msg.bot ol { padding-left:20px; margin:4px 0; }
  .msg.hint { align-self:center; color:var(--muted); font-size:12.5px; background:none; border:none; }
  .chatrow { display:flex; gap:10px; margin-top:14px; }
  .chatrow input { flex:1; }
  .dotting::after { content:"…"; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"·"} 50%{content:"··"} 75%{content:"···"} }
  .viz { align-self:stretch; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .viz-head { padding:10px 14px; font-size:13px; font-weight:600; border-bottom:1px solid var(--line); background:#f8fafc;
              display:flex; align-items:center; gap:8px; }
  .viz-head .badge { font-size:10.5px; font-weight:normal; color:#b45309; background:#fef3c7; border:1px solid #fde68a; padding:1px 8px; border-radius:999px; }
  .viz-body { display:flex; }
  .map-wrap { flex:1.25; position:relative; min-width:0; border-right:1px solid var(--line); }
  .map-wrap canvas { width:100%; display:block; cursor:crosshair; }
  .viz-stats { flex:1; padding:14px 16px; min-width:236px; }
  .kpis { display:flex; gap:8px; }
  .kpi { flex:1; text-align:center; padding:10px 4px; background:#f8fafc; border-radius:9px; border:1px solid #eef2f7; }
  .kpi b { display:block; font-size:20px; color:#1e293b; }
  .kpi span { font-size:11px; color:var(--muted); }
  .top5 { margin-top:14px; }
  .top5 h4 { font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:normal; }
  .trow { display:flex; align-items:center; gap:8px; font-size:12px; margin:5px 0; }
  .trow .nm { width:46px; color:#334155; }
  .trow .bar { height:8px; border-radius:4px; background:linear-gradient(90deg,#93c5fd,#1d4ed8); flex:1; }
  .trow .dv { width:56px; text-align:right; color:#1e3a8a; }
  .viz-foot { display:flex; align-items:center; gap:14px; padding:8px 14px; font-size:11px; color:var(--muted); border-top:1px solid var(--line); flex-wrap:wrap; }
  .viz-foot .sw { display:inline-block; width:12px; height:8px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .viz-foot .bar { width:90px; height:6px; border-radius:3px; }
  .viz-foot a { color:var(--blue); text-decoration:none; padding:2px 6px; border-radius:5px; }
  .viz-foot a:hover { background:#eff6ff; }
  .viz.narrow .viz-body { flex-direction: column; }
  .viz.narrow .map-wrap { border-right: none; border-bottom: 1px solid var(--line); }
  .viz.narrow .viz-stats { min-width: 0; }
  .viz.narrow .kpi b { font-size: 17px; }
  .viz.narrow .trow .dv { width: 48px; }
  .viz.narrow .viz-foot { gap: 10px; }
  #viz-tip { position:fixed; z-index:99; background:#111827ee; color:#fff; font-size:12px; padding:4px 8px; border-radius:6px; pointer-events:none; display:none; }
  #errbar { background:#fef2f2; color:#dc2626; padding:8px 14px; font-size:12px; border-bottom:1px solid #fecaca; display:none; white-space:pre-wrap; }
  @media (max-width: 720px) { header .tt h1 { font-size:17px; } .wrap { padding:14px 10px 40px; } }
</style>
</head>
<body>
<div id="errbar"></div>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 32 32"><path d="M16 4c4.8 5.8 8.5 10.2 8.5 14.3a8.5 8.5 0 1 1-17 0C7.5 14.2 11.2 9.8 16 4z" fill="#fff"/><circle cx="13.4" cy="18.6" r="3" fill="#3b82f6"/></svg></div>
    <div class="tt"><h1>内涝快评 <span style="font-size:12px;color:#94a3b8;font-weight:normal">swmm-copilot</span></h1>
      <div class="sub">自然语言驱动的城市内涝快速评估 · 规划级</div></div>
    <span class="ver">v6</span>
  </header>

  <div class="card" id="cfg-card">
    <h2>模型配置</h2>
    <div class="grid">
      <div><label>Base URL（OpenAI 兼容，含 /v1）</label><input id="base_url" placeholder="http://host:port/v1"></div>
      <div><label>API Key</label><input id="api_key" type="password" placeholder="sk-…"></div>
      <div><label>模型名</label><input id="model" placeholder="qwen3827b"></div>
    </div>
    <div class="row">
      <button class="btn ghost" id="btn-test">测试连接</button>
      <button class="btn" id="btn-save">保存配置</button>
    </div>
    <div class="status" id="test-status"></div>
  </div>

  <div class="card">
    <h2>评估对话</h2>
    <div class="chips" id="chips"></div>
    <div id="msgs"></div>
    <div class="chatrow">
      <input id="input" placeholder="输入评估需求…（Enter 发送）">
      <button class="btn" id="btn-send">发送</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const history = [];
let cfgReady = false;  // 模型是否已配置
window.addEventListener("error", e => {
  const bar = $("errbar"); document.body.prepend(bar); bar.style.display = "block";
  bar.textContent = "脚本错误：" + e.message + "（" + (e.filename || "").split("/").pop() + ":" + e.lineno + "）";
});

// 轻量 Markdown 渲染：标题/粗体/代码/表格/列表（转义优先，防注入）
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(src){
  const lines = esc(src).split("\n"); let html = "", inTable = false, inList = null;
  const closeList = () => { if(inList){ html += `</${inList}>`; inList = null; } };
  const closeTable = () => { if(inTable){ html += "</tbody></table>"; inTable = false; } };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (/^\|.*\|$/.test(l)) {
      const cells = l.slice(1,-1).split("|").map(c => c.trim());
      if (cells.every(c => /^-+$/.test(c))) continue;
      if (!inTable) { closeList(); html += "<table><thead><tr>" + cells.map(c=>`<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>"; inTable = true; continue; }
      html += "<tr>" + cells.map(c=>`<td>${inline(c)}</td>`).join("") + "</tr>"; continue;
    } else closeTable();
    const m = l.match(/^(#{1,4})\s+(.*)/);
    if (m) { closeList(); html += `<h3>${inline(m[2])}</h3>`; continue; }
    const li = l.match(/^[-*]\s+(.*)/) || l.match(/^\d+\.\s+(.*)/);
    if (li) {
      const tag = /^\d+\./.test(l) ? "ol" : "ul";
      if (inList !== tag) { closeList(); html += `<${tag}>`; inList = tag; }
      html += `<li>${inline(li[1])}</li>`; continue;
    }
    closeList();
    if (l === "") continue;
    html += `<p>${inline(l)}</p>`;
  }
  closeList(); closeTable();
  return html;
  function inline(s){ return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
}

function addMsg(text, who){
  if (who === "hint"){ const d = document.createElement("div"); d.className = "msg hint"; d.textContent = text; $("msgs").appendChild(d); return d; }
  const d = document.createElement("div");
  d.className = "msg " + who;
  if (who === "user") d.textContent = text; else d.innerHTML = md(text);
  $("msgs").appendChild(d); $("msgs").scrollTop = 1e9;
  return d;
}

// 初始化：载入配置与片区；未配置时引导
fetch("/api/config").then(r=>r.json()).then(c=>{
  if (c.base_url) { $("base_url").value = c.base_url; cfgReady = true; }
  if (c.api_key)  $("api_key").value  = c.api_key;
  if (c.model)    $("model").value    = c.model;
  if (!cfgReady) {
    $("cfg-card").classList.add("attention");
    addMsg("请先在上方「模型配置」填写 OpenAI 兼容接口信息，点「测试连接」通过后保存，即可开始评估", "hint");
  } else addMsg("点击上方片区或直接输入，例如「评估深圳福田50年一遇的内涝风险」", "hint");
});
fetch("/api/aois").then(r=>r.json()).then(list=>{
  list.forEach(a=>{
    const s = document.createElement("span");
    s.className = "chip"; s.textContent = `${a.aoi}（${a.city}）`;
    s.onclick = () => { $("input").value = `评估${a.aoi}50年一遇的内涝风险`; $("input").focus(); };
    $("chips").appendChild(s);
  });
});

function form(){ return { base_url: $("base_url").value.trim(), api_key: $("api_key").value.trim(), model: $("model").value.trim() }; }

$("btn-test").onclick = async () => {
  const st = $("test-status");
  st.className = "status"; st.textContent = "";
  $("btn-test").disabled = true; $("btn-test").textContent = "测试中…";
  try {
    const r = await fetch("/api/test", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(form()) }).then(r=>r.json());
    if (r.ok) { st.className = "status ok"; st.textContent = `连接成功：${r.latency_ms} ms，可用模型 ${r.models.length} 个（${r.models.slice(0,5).join("、")}${r.models.length>5?" 等":""}）`; }
    else { st.className = "status err"; st.textContent = r.error; }
  } catch (e) { st.className = "status err"; st.textContent = "请求失败：" + e; }
  $("btn-test").disabled = false; $("btn-test").textContent = "测试连接";
};

$("btn-save").onclick = async () => {
  const st = $("test-status");
  const r = await fetch("/api/config", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(form()) }).then(r=>r.json());
  st.className = "status " + (r.ok ? "ok" : "err"); st.textContent = r.ok ? "配置已保存到本地 .env（密钥不入仓库）" : r.error;
  if (r.ok) { cfgReady = true; $("cfg-card").classList.remove("attention"); }
};

// ---- 评估结果可视化 ----
function hillshade(dem){
  const h = dem.length, w = dem[0].length, out = [];
  for (let r = 0; r < h; r++) { out.push([]);
    for (let c = 0; c < w; c++) {
      const zx = dem[r][Math.min(w-1,c+1)] - dem[r][Math.max(0,c-1)];
      const zy = dem[Math.min(h-1,r+1)][c] - dem[Math.max(0,r-1)][c];
      const nx = -zx, ny = -zy, nz = 60;
      const len = Math.hypot(nx, ny, nz) || 1;
      const dot = (nx - ny + nz * 1.414) / len / 1.732;
      out[r].push(Math.max(0.45, Math.min(0.97, (dot + 1) / 2 + 0.28)));
    }
  }
  return out;
}
function floodColor(t, alpha){
  const stops = [[0,[186,230,253]],[0.4,[96,165,250]],[0.75,[37,99,235]],[1,[23,37,84]]];
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0,c0] = stops[i-1], [t1,c1] = stops[i], k = (t-t0)/(t1-t0);
    const c = c0.map((v,j)=>Math.round(v+(c1[j]-v)*k));
    return `rgba(${c.join(",")},${alpha})`;
  }
  return `rgba(23,37,84,${alpha})`;
}
function renderViz(res){
  const viz = res.viz, [w,s,e,n] = viz.bbox;
  const box = document.createElement("div"); box.className = "viz";
  box.innerHTML = `
    <div class="viz-head">${res.aoi} · ${res.return_period_yr} 年一遇 · 内涝快速评估 <span class="badge">规划级</span></div>
    <div class="viz-body">
      <div class="map-wrap"><canvas></canvas></div>
      <div class="viz-stats">
        <div class="kpis">
          <div class="kpi"><b>${res.rain_total_mm}</b><span>设计总雨量 mm</span></div>
          <div class="kpi"><b>${res.flood_nodes}/${res.total_nodes}</b><span>溢流节点</span></div>
          <div class="kpi"><b>${res.max_depth_mm}</b><span>最大积水 mm</span></div>
        </div>
        <div class="top5"><h4>积水最深点 Top 5</h4>
          ${res.top5.map(t => `<div class="trow"><span class="nm">${t.node}</span>
            <span class="bar" style="opacity:${0.35 + 0.65*t.depth_mm/res.max_depth_mm}"></span>
            <span class="dv">${t.depth_mm} mm</span></div>`).join("")}
        </div>
      </div>
    </div>
    <div class="viz-foot">
      <span><span class="sw bar" style="background:linear-gradient(90deg,#bae6fd,#60a5fa,#2563eb,#172554)"></span>积水 0 → ${viz.max_depth} mm</span>
      <span><span class="sw" style="background:#fde68a"></span>主干道</span>
      <span><span class="sw" style="background:#38bdf8"></span>水系</span>
      <span><span class="sw" style="background:#10b981"></span>排放口</span>
      <span style="flex:1"></span>
      <a href="/api/artifact?aoi=${viz.slug}&p=${viz.p}&name=report.docx" download>报告 Word</a>
      <a href="/api/artifact?aoi=${viz.slug}&p=${viz.p}&name=report.md" download>报告 MD</a>
      <a href="/api/artifact?aoi=${viz.slug}&p=${viz.p}&name=flood_map.png" download>风险图</a>
      <a href="/api/artifact?aoi=${viz.slug}&p=${viz.p}&name=model.inp" download>SWMM 模型</a>
    </div>`;
  $("msgs").appendChild(box);

  const cv = box.querySelector("canvas"), mapWrap = box.querySelector(".map-wrap");
  const ratio = (n - s) / (e - w);
  const wet = viz.nodes.filter(nd => nd.depth > 0);
  let X, Y;
  const tip = document.getElementById("viz-tip") || (() => {
    const t = document.createElement("div"); t.id = "viz-tip"; document.body.appendChild(t); return t;
  })();

  const draw = () => {
    const W = mapWrap.clientWidth || 560;
    const H = Math.min(420, Math.round(innerHeight * 0.55), Math.round(W * ratio));
    cv.width = W * 2; cv.height = H * 2; cv.style.height = H + "px";
    const ctx = cv.getContext("2d"); ctx.setTransform(2, 0, 0, 2, 0, 0);
    const curW = W, curH = H;
    X = lon => (lon - w) / (e - w) * curW; Y = lat => (n - lat) / (n - s) * curH;
    const sc = Math.max(0.55, Math.min(1, W / 560));

    // 1 灰阶山体阴影
    const hs = hillshade(viz.dem), dh = hs.length, dw = hs[0].length, cw = W / dw, ch = H / dh;
    for (let r = 0; r < dh; r++) for (let c = 0; c < dw; c++) {
      const g = Math.round(40 + 200 * hs[r][c]);
      ctx.fillStyle = `rgb(${g},${g + 2},${g + 5})`;
      ctx.fillRect(c * cw, r * ch, cw + 1, ch + 1);
    }
    // 2 连续积水（色差）
    const fl = viz.flood || [], fm = viz.max_depth || 1;
    for (let r = 0; r < fl.length; r++) for (let c = 0; c < fl[r].length; c++) {
      const d = fl[r][c];
      if (d > 0) { ctx.fillStyle = floodColor(Math.min(1, d / fm), 0.78);
        ctx.fillRect(c * cw, r * ch, cw + 1, ch + 1); }
    }
    // 3 水系与道路
    const osm = viz.osm || {};
    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 1.8 * sc; ctx.globalAlpha = 0.9;
    (osm.waterways || []).forEach(line => { ctx.beginPath(); line.forEach(([lo,la],i) => i ? ctx.lineTo(X(lo),Y(la)) : ctx.moveTo(X(lo),Y(la))); ctx.stroke(); });
    ctx.globalAlpha = 0.55; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
    (osm.roads || []).forEach(line => { ctx.beginPath(); line.forEach(([lo,la],i) => i ? ctx.lineTo(X(lo),Y(la)) : ctx.moveTo(X(lo),Y(la))); ctx.stroke(); });
    ctx.globalAlpha = 0.92; ctx.strokeStyle = "#fde68a"; ctx.lineWidth = 2.2 * sc;
    (osm.road_major || []).forEach(line => { ctx.beginPath(); line.forEach(([lo,la],i) => i ? ctx.lineTo(X(lo),Y(la)) : ctx.moveTo(X(lo),Y(la))); ctx.stroke(); });
    ctx.globalAlpha = 1;
    // 4 地名（抽稀避让）
    ctx.font = `${Math.round(11 * Math.max(0.8, sc))}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const placed = [];
    (osm.places || []).forEach(([lo, la, name]) => {
      const px = X(lo), py = Y(la);
      if (placed.some(q => Math.hypot(q[0]-px, q[1]-py) < 44)) return;
      placed.push([px, py]);
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(15,23,42,.75)"; ctx.strokeText(name, px, py);
      ctx.fillStyle = "#fff"; ctx.fillText(name, px, py);
    });
    // 5 排放口与节点
    ctx.fillStyle = "#10b981"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    viz.outfalls.forEach(([x,y]) => { const px = X(x), py = Y(y), a = 6 * sc, b = 5 * sc;
      ctx.beginPath(); ctx.moveTo(px,py-a); ctx.lineTo(px+a,py+b); ctx.lineTo(px-a,py+b); ctx.closePath(); ctx.fill(); ctx.stroke(); });
    wet.forEach(nd => {
      ctx.beginPath(); ctx.arc(X(nd.x), Y(nd.y), 2.2 * sc, 0, 7);
      ctx.fillStyle = "rgba(30,58,138,.85)"; ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 0.8; ctx.stroke();
    });
    // 6 指北针（右上）
    const nx0 = W - 26 * (sc < 0.8 ? 0.8 : 1), ny0 = 26;
    ctx.fillStyle = "rgba(255,255,255,.75)"; ctx.beginPath(); ctx.arc(nx0, ny0, 15, 0, 7); ctx.fill();
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(nx0, ny0 + 8); ctx.lineTo(nx0, ny0 - 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(nx0, ny0 - 9); ctx.lineTo(nx0 - 4, ny0 - 3); ctx.lineTo(nx0 + 4, ny0 - 3); ctx.closePath();
    ctx.fillStyle = "#dc2626"; ctx.fill();
    ctx.fillStyle = "#334155"; ctx.font = "bold 9px sans-serif"; ctx.fillText("N", nx0, ny0 + 13);
    // 7 比例尺（左下）：取整百米
    const kmPerPx = (e - w) * 111.32 * Math.cos((n + s) / 2 * Math.PI / 180) / W;
    let barKm = [0.5, 1, 2, 3, 5].find(k => k / kmPerPx < W * 0.28) || 5;
    const barPx = barKm / kmPerPx, bx0 = 12, by0 = H - 14;
    ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.fillRect(bx0 - 6, by0 - 14, barPx + 34, 22);
    ctx.fillStyle = "#334155"; ctx.fillRect(bx0, by0 - 6, barPx / 2, 4);
    ctx.fillStyle = "#fff"; ctx.fillRect(bx0 + barPx / 2, by0 - 6, barPx / 2, 4);
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 0.8; ctx.strokeRect(bx0, by0 - 6, barPx, 4);
    ctx.fillStyle = "#334155"; ctx.font = "10px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(barKm < 1 ? `${barKm * 1000} m` : `${barKm} km`, bx0 + barPx + 5, by0 - 3);
  };
  draw();
  const applyLayout = () => box.classList.toggle("narrow", box.clientWidth < 620);
  applyLayout();
  let timer = null;
  new ResizeObserver(es => {
    clearTimeout(timer);
    timer = setTimeout(() => { applyLayout(); draw(); }, 100);
  }).observe(box);
  let wt = null;
  window.addEventListener("resize", () => {
    clearTimeout(wt); wt = setTimeout(() => { applyLayout(); draw(); }, 150);
  });
  cv.onmousemove = ev => {
    const rc = cv.getBoundingClientRect();
    const mx = (ev.clientX - rc.left) / rc.width * (cv.width / 2);
    const my = (ev.clientY - rc.top) / rc.height * (cv.height / 2);
    let best = null, bd = 15;
    wet.forEach(nd => { const d = Math.hypot(X(nd.x) - mx, Y(nd.y) - my); if (d < bd) { bd = d; best = nd; } });
    if (best) { tip.style.display = "block"; tip.style.left = ev.clientX + 14 + "px"; tip.style.top = ev.clientY - 10 + "px";
      tip.textContent = `${best.name}｜积水 ${best.depth} mm`; }
    else tip.style.display = "none";
  };
  cv.onmouseleave = () => tip.style.display = "none";
  const snap = () => window.scrollTo({ top: box.getBoundingClientRect().top + scrollY - 8, behavior: "smooth" });
  snap(); setTimeout(snap, 400); setTimeout(snap, 1000);
}

const STAGES = ["正在获取地形与土地覆盖数据…", "SWMM 水力模拟中…", "正在生成积水分布…", "模型解读结果中…"];

async function send(){
  const text = $("input").value.trim();
  if (!text) return;
  if (!cfgReady) { addMsg("请先完成上方「模型配置」（测试连接 → 保存），再发起评估", "hint"); $("cfg-card").classList.add("attention"); return; }
  $("input").value = ""; $("btn-send").disabled = true;
  addMsg(text, "user");
  const loading = addMsg(STAGES[0], "hint");
  loading.classList.add("dotting");
  let si = 0;
  const stTimer = setInterval(() => { si = (si + 1) % STAGES.length; loading.textContent = STAGES[si]; }, 9000);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  try {
    const r = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ message: text, history }) }).then(r=>r.json());
    loading.remove(); clearInterval(stTimer);
    if (r.ok) { addMsg(r.reply, "bot"); if (r.result && r.result.viz) renderViz(r.result);
      history.push({role:"user",content:text},{role:"assistant",content:r.reply}); }
    else addMsg("出错：" + r.error, "hint");
  } catch (e) { loading.remove(); clearInterval(stTimer); addMsg("请求失败：" + e, "hint"); }
  $("btn-send").disabled = false; $("input").focus();
}
$("btn-send").onclick = send;
$("input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
